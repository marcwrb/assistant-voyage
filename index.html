.tabs{

.tabs button:hover{
    background:rgba(255,255,255,0.3);
}

.tabs button.active{
    background:white;
    color:#0078D4;
    border:1px solid white;
}

#inventaireZone{
    display:none;
}

.checkbox-group{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.checkbox-group label{
    display:flex;
    align-items:center;
    gap:10px;
    cursor:pointer;
}

.checkbox-group input[type="checkbox"]{
    width:18px;
    height:18px;
    margin:0;
    padding:0;
    flex-shrink:0;
}

h3{
    color:#0078D4;
}
label{
    cursor:pointer;
}
</style>

function genererListe(){

let html = "";

const iris =
document.getElementById("iris").value;

const typeVoyage =
document.getElementById("typeVoyage").value;

const jours =
parseInt(
document.getElementById("jours").value
) || 1;

// =======================
// QUANTITES ADULTES
// =======================

html += `
<div class="card">
<h3>👨 Adultes - Vêtements</h3>

<label class="item">
<input type="checkbox">
${jours + 1} sous-vêtements
</label>

<label class="item">
<input type="checkbox">
${jours + 1} paires de chaussettes
</label>

<label class="item">
<input type="checkbox">
${jours + 1} t-shirts
</label>

<label class="item">
<input type="checkbox">
${Math.ceil(jours / 2)} pyjamas
</label>

</div>
`;

// =======================
// QUANTITES IRIS
// =======================

if(iris === "oui"){

html += `
<div class="card">

<h3>👶 Iris - Habits</h3>

<label class="item">
<input type="checkbox">
${jours + 2} bodys
</label>

<label class="item">
<input type="checkbox">
${jours + 2} tenues
</label>

<label class="item">
<input type="checkbox">
${Math.ceil(jours / 2) + 1} pyjamas
</label>

<label class="item">
<input type="checkbox">
${jours * 4} couches
</label>

</div>
`;
}

// =======================
// INVENTAIRE DE BASE
// =======================

for(const section in inventaire){

if(
iris === "non" &&
section.includes("Iris")
){
continue;
}

// on évite les doublons
if(
section === "👶 Iris - Habits"
){
continue;
}

if(
section === "👨 Adultes"
){
continue;
}

html += `<div class="card">
<h3>${section}</h3>`;

inventaire[section].forEach(
(item,index)=>{


html += `
<label class="item">
<input type="checkbox">
${item}
</label>
`;

});

html += `</div>`;

}

// =======================
// TYPE DE VOYAGE
// =======================

if(typesVoyage[typeVoyage]){

html += `
<div class="card">

<h3>🏕️ ${typeVoyage}</h3>
`;

typesVoyage[typeVoyage].forEach(item=>{

html += `
<label class="item">
<input type="checkbox">
${item}
</label>
`;

});

html += `
</div>
`;

}

// =======================
// ACTIVITES
// =======================

document
.querySelectorAll(
".checkbox-group input[type='checkbox']"
)
.forEach(cb=>{

if(!cb.checked) return;

const nom =
cb.parentElement.textContent.trim();

if(!activites[nom]) return;

html += `
<div class="card">

<h3>🎯 ${nom}</h3>
`;

activites[nom].forEach(item=>{

html += `
<label class="item">
<input type="checkbox">
${item}
</label>
`;

});

html += `
</div>
`;

});

// =======================

document.getElementById(
"resultat"
).innerHTML = html;

}

function chargerFavori(type){

if(type==="plv"){
document.getElementById("jours").value=2;
document.getElementById("typeVoyage").value="Week-end famille";
}

if(type==="vosges"){
document.getElementById("jours").value=3;

}

if(type==="copains"){

document.getElementById("typeVoyage").value="Week-end famille";
}

}

function ouvrirOnglet(id){

    document.getElementById(
        "voyageZone"
    ).style.display = "none";

    document.getElementById(
        "inventaireZone"
    ).style.display = "none";

    document.getElementById(
        id
    ).style.display = "block";

    document
    .querySelectorAll(".tabs button")
    .forEach(btn=>{

        btn.classList.remove("active");

    });

    if(id === "voyageZone"){

        document
        .getElementById("btnVoyage")
        .classList.add("active");

    }else{

        document
        .getElementById("btnInventaire")
        .classList.add("active");

    }

}

function sauvegarderInventaire(){

    localStorage.setItem(
        "inventaire",
        JSON.stringify(inventaire)
    );

}

function ajouterObjet(){

    const nom =
    document
    .getElementById("nomObjet")
    .value
    .trim();

    const categorie =
    document
    .getElementById("categorieObjet")
    .value;

    if(!nom) return;

    inventaire[categorie].push(nom);

    sauvegarderInventaire();

    afficherInventaire();

    document
    .getElementById("nomObjet")
    .value = "";

}

function modifierObjet(
    categorie,
    index
){

    const nouveauNom =
    prompt(
        "Modifier l'objet",
        inventaire[categorie][index]
    );

    if(!nouveauNom){
        return;
    }

    inventaire[categorie][index] =
    nouveauNom;

    sauvegarderInventaire();

    afficherInventaire();

}

function supprimerObjet(
    categorie,
    index
){

    if(
        !confirm(
            "Supprimer cet objet ?"
        )
    ){
        return;
    }

    inventaire[categorie]
    .splice(index,1);

    sauvegarderInventaire();

    afficherInventaire();

}


function remplirListeCategories(){

    const select =
    document.getElementById(
        "categorieObjet"
    );

    if(!select) return;

    select.innerHTML = "";

    Object.keys(inventaire)
    .forEach(categorie=>{

        select.innerHTML += `
        <option>
        ${categorie}
        </option>
        `;

    });

}

function ajouterCategorie(){

    const nouvelleCategorie =
    document
    .getElementById(
        "nouvelleCategorie"
    )
    .value
    .trim();

    if(!nouvelleCategorie){
        return;
    }

    if(
        inventaire[nouvelleCategorie]
    ){
        alert(
        "Cette catégorie existe déjà"
        );
        return;
    }

    inventaire[
        nouvelleCategorie
    ] = [];

    sauvegarderInventaire();

    remplirListeCategories();

    afficherInventaire();

    document
    .getElementById(
        "nouvelleCategorie"
    )
    .value = "";

}

function supprimerCategorie(
categorie
){

    if(
        inventaire[categorie]
        .length > 0
    ){

        alert(
        "La catégorie doit être vide"
        );

        return;
    }

    delete inventaire[categorie];

    sauvegarderInventaire();

    remplirListeCategories();

    afficherInventaire();

}

function exporterInventaire(){

    const contenu =
    JSON.stringify(
        inventaire,
        null,
        2
    );

    const blob =
    new Blob(
        [contenu],
        {
            type:"application/json"
        }
    );

    const url =
    URL.createObjectURL(blob);

    const lien =
    document.createElement("a");

    lien.href = url;

    lien.download =
    "inventaire.json";

    lien.click();

    URL.revokeObjectURL(url);

}

function importerInventaire(event){

    const fichier =
    event.target.files[0];

    if(!fichier){
        return;
    }

    const lecteur =
    new FileReader();

    lecteur.onload =
    function(e){

        try{

            inventaire =
            JSON.parse(
                e.target.result
            );

            sauvegarderInventaire();

            remplirListeCategories();

            afficherInventaire();

            alert(
            "Inventaire importé avec succès ✅"
            );

        }
        catch{

            alert(
            "Fichier invalide ❌"
            );

        }

    };

    lecteur.readAsText(
        fichier
    );

}

function sauvegarderFavoris(){

    localStorage.setItem(
        "favoris",
        JSON.stringify(favoris)
    );

}

function sauvegarderFavori(){

    const nom =
    document.getElementById(
        "nomFavori"
    ).value.trim();

    if(!nom){
        alert("Nom obligatoire");
        return;
    }

    const activitesSelectionnees = [];

    document
    .querySelectorAll(
        ".checkbox-group input[type='checkbox']"
    )
    .forEach(cb=>{

        if(cb.checked){

            activitesSelectionnees.push(
                cb.parentElement
                .textContent
                .trim()
            );

        }

    });

    favoris[nom] = {

        destination:
        document.getElementById(
            "destination"
        ).value,

        jours:
        document.getElementById(
            "jours"
        ).value,

        iris:
        document.getElementById(
            "iris"
        ).value,

        typeVoyage:
        document.getElementById(
            "typeVoyage"
        ).value,

        activites:
        activitesSelectionnees

    };

    sauvegarderFavoris();

    afficherFavoris();

    alert(
    "Favori enregistré ✅"
    );

}

function afficherFavoris(){

    let html = "";

    for(const nom in favoris){

        html += `

        <div
        style="
        display:flex;
        gap:10px;
        margin-bottom:10px;
        ">

            <button
            class="favori"
            style="flex:1"
            onclick="
            chargerFavoriPerso(
            '${nom}'
            )
            ">
            ⭐ ${nom}
            </button>

            <button
            onclick="
            supprimerFavori(
            '${nom}'
            )
            ">
            ❌
            </button>

        </div>

        `;
    }

    document.getElementById(
        "favorisListe"
    ).innerHTML = html;

}

function chargerFavoriPerso(nom){

    const favori =
    favoris[nom];

    document
    .getElementById(
        "destination"
    ).value =
    favori.destination;

    document
    .getElementById(
        "jours"
    ).value =
    favori.jours;

    document
    .getElementById(
        "iris"
    ).value =
    favori.iris;

    document
    .getElementById(
        "typeVoyage"
    ).value =
    favori.typeVoyage;

    document
    .querySelectorAll(
        ".checkbox-group input[type='checkbox']"
    )
    .forEach(cb=>{

        const nomActivite =
        cb.parentElement
        .textContent
        .trim();

        cb.checked =
        favori.activites.includes(
            nomActivite
        );

    });

    genererListe();

}

function supprimerFavori(nom){

    if(
        !confirm(
        "Supprimer le favori ?"
        )
    ){
        return;
    }

    delete favoris[nom];

    sauvegarderFavoris();

    afficherFavoris();

}

function synchroniserInventaire(){

    if(
        !confirm(
            "Mettre à jour l'inventaire avec le contenu du code ?"
        )
    ){
        return;
    }

    for(const categorie in inventaireDefaut){

        if(!inventaire[categorie]){

            inventaire[categorie] =
            [...inventaireDefaut[categorie]];

        }
        else{

            inventaireDefaut[categorie]
            .forEach(item=>{

                if(
                    !inventaire[categorie]
                    .includes(item)
                ){

                    inventaire[categorie]
                    .push(item);

                }

            });

        }

    }

    sauvegarderInventaire();

    remplirListeCategories();

    afficherInventaire();

    alert(
        "Inventaire synchronisé ✅"
    );

}

async function partagerChecklist(){

    let texte = "";

    document
    .querySelectorAll("#resultat .card")
    .forEach(carte=>{

        const titre =
        carte.querySelector("h3");

        if(titre){

            texte += "\n";
            texte += titre.textContent;
            texte += "\n";

        }

        carte
        .querySelectorAll(".item")
        .forEach(item=>{

            texte +=
            "☐ " +
            item.textContent.trim()
            + "\n";

        });

    });

    if(
        navigator.share
    ){

        try{

await navigator.share({

    title:
    "Checklist - " +
    document.getElementById(
    "destination"
    ).value,

    text:
    "Destination : " +
    document.getElementById(
    "destination"
    ).value +
    "\n\n" +
    texte

});

        }
        catch(err){

            console.log(err);

        }

    }else{

        navigator.clipboard
        .writeText(texte);

        alert(
        "Partage non supporté.\nChecklist copiée dans le presse-papiers ✅"
        );

    }

}

if ('serviceWorker' in navigator) {

    window.addEventListener('load', () => {

        navigator.serviceWorker
        .register('sw.js');

    });

}

remplirListeCategories();
afficherInventaire();
afficherFavoris();

ouvrirOnglet("voyageZone");

</script>
